name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  workflow_dispatch:

jobs:

  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true' }}

    runs-on: ubuntu-latest

    steps:

      - uses: appleboy/ssh-action@v1

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            if [ ! -d ~/Three-tier-app-Action ]; then
              git clone https://github.com/Abhi-Sangawade/Three-tier-app-Action.git ~/Three-tier-app-Action
            fi

            cd ~/Three-tier-app-Action

            git pull origin main

            if [ ! -f .env ]; then
              echo "ERROR: ~/Three-tier-app-Action/.env is missing."
              exit 1
            fi

            docker compose pull

            docker compose up -d

            docker image prune -f
