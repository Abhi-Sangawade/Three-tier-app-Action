name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

  workflow_dispatch:

jobs:

  # =========================================
  # Job 1 - Validate Deployment Trigger
  # =========================================

  validate-trigger:

    runs-on: ubuntu-latest

    steps:

      - name: Validate Workflow Trigger
        run: |
          echo "CD Pipeline Triggered Successfully"


  # =========================================
  # Job 2 - Verify EC2 Connectivity
  # =========================================

  verify-ec2:

    runs-on: ubuntu-latest

    needs: validate-trigger

    steps:

      - name: Verify SSH Connection
        uses: appleboy/ssh-action@v1

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            echo "EC2 Connection Successful"
            hostname
            docker --version
            docker-compose --version


  # =========================================
  # Job 3 - Clone Latest Repository
  # =========================================

  clone-repository:

    runs-on: ubuntu-latest

    needs: verify-ec2

    steps:

      - name: Clone Latest Repository on EC2
        uses: appleboy/ssh-action@v1

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            sudo systemctl start docker

            rm -rf ~/Three-tier-app-Action

            git clone https://github.com/Abhi-Sangawade/Three-tier-app-Action.git ~/Three-tier-app-Action

            cd ~/Three-tier-app-Action

            ls -la


  # =========================================
  # Job 4 - Create Environment File
  # =========================================

  create-env:

    runs-on: ubuntu-latest

    needs: clone-repository

    steps:

      - name: Create .env File
        uses: appleboy/ssh-action@v1

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            cd ~/Three-tier-app-Action

            cat > .env <<EOF
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            MYSQL_ROOT_PASSWORD=root123
            DB_NAME=skillpulse
            DB_USER=skilluser
            DB_PASSWORD=skillpass
            EOF

            cat .env


  # =========================================
  # Job 5 - Deploy Containers
  # =========================================

  deploy-containers:

    runs-on: ubuntu-latest

    needs: create-env

    steps:

      - name: Deploy Docker Containers
        uses: appleboy/ssh-action@v1

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            cd ~/Three-tier-app-Action

            docker-compose up -d

            docker ps -a


  # =========================================
  # Job 6 - Verify Deployment
  # =========================================

  verify-deployment:

    runs-on: ubuntu-latest

    needs: deploy-containers

    steps:

      - name: Verify Running Containers
        uses: appleboy/ssh-action@v1

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            docker ps

            cd ~/Three-tier-app-Action

            docker-compose logs --tail=50

            curl -I http://localhost
