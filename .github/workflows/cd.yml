name: CD
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:

jobs:
  connect-ec2:
    runs-on: ubuntu-latest
    steps:
      # =========================================
      # Stage 1 - Connect to EC2 Server
      # =========================================
      - name: Connect to EC2 and Start Docker
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "===== START DEPLOY ====="
            sudo systemctl start docker
            docker --version
            docker-compose --version

  clone-repository:
    runs-on: ubuntu-latest
    needs: connect-ec2
    steps:
      # =========================================
      # Stage 2 - Clone Latest Repository
      # =========================================
      - name: Clone Latest Repository
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            rm -rf ~/Three-tier-app-Action
            git clone https://github.com/Abhi-Sangawade/Three-tier-app-Action.git ~/Three-tier-app-Action
            cd ~/Three-tier-app-Action
            ls -la

  create-env:
    runs-on: ubuntu-latest
    needs: clone-repository
    steps:
      # =========================================
      # Stage 3 - Create Environment File
      # =========================================
      - name: Create .env File
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Three-tier-app-Action
            cat > .env <<EOF
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            MYSQL_ROOT_PASSWORD=root123
            DB_NAME=skillpulse
            DB_USER=skilluser
            DB_PASSWORD=skillpass
            EOF
            cat .env

  deploy-containers:
    runs-on: ubuntu-latest
    needs: create-env
    steps:
      # =========================================
      # Stage 4 - Deploy Docker Containers
      # =========================================
      - name: Deploy Containers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Three-tier-app-Action
            docker-compose up -d
            docker ps -a

  verify-deployment:
    runs-on: ubuntu-latest
    needs: deploy-containers
    steps:
      # =========================================
      # Stage 5 - Verify Deployment
      # =========================================
      - name: Verify Running Application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker ps
            cd ~/Three-tier-app-Action
            docker-compose logs --tail=50
            curl -I http://localhost
            echo "===== DEPLOYMENT SUCCESS ====="
