name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

  workflow_dispatch:

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            sudo systemctl start docker

            if [ ! -d ~/Three-tier-app-Action ]; then
              git clone https://github.com/Abhi-Sangawade/Three-tier-app-Action.git ~/Three-tier-app-Action
            fi

            cd ~/Three-tier-app-Action

            git pull origin main

            docker compose up -d --build

            docker ps
