name: CI

on:
  push:
    branches: [main]

    paths-ignore:
      - 'k8s/**'
      - 'docs/**'
      - '**/*.md'

  workflow_dispatch:

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:

      # =========================================
      # Stage 1 - Checkout Source Code
      # =========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================
      # Stage 2 - Setup Docker Buildx
      # =========================================

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4


      # =========================================
      # Stage 3 - DockerHub Authentication
      # =========================================

      - name: Login to DockerHub
        uses: docker/login-action@v4
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}

        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # =========================================
      # Stage 4 - Build & Push Backend Image
      # =========================================

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v7

        with:
          context: ./backend

          push: ${{ vars.DEPLOY_ENABLED == 'true' }}

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/skillpulse-backend:latest', secrets.DOCKERHUB_USERNAME) || 'skillpulse-backend:latest' }}

            ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/skillpulse-backend:{1}', secrets.DOCKERHUB_USERNAME, github.sha) || format('skillpulse-backend:{0}', github.sha) }}


      # =========================================
      # Stage 5 - Build & Push Frontend Image
      # =========================================

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v7

        with:
          context: ./frontend

          push: ${{ vars.DEPLOY_ENABLED == 'true' }}

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/skillpulse-frontend:latest', secrets.DOCKERHUB_USERNAME) || 'skillpulse-frontend:latest' }}

            ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/skillpulse-frontend:{1}', secrets.DOCKERHUB_USERNAME, github.sha) || format('skillpulse-frontend:{0}', github.sha) }}
