name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - 'docs/**'
      - '**/*.md'

  workflow_dispatch:

jobs:

  # =========================================
  # Job 1 - Checkout and Prepare Environment
  # =========================================

  setup:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Repository Files
        run: |
          ls -la

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4


  # =========================================
  # Job 2 - DockerHub Authentication
  # =========================================

  docker-login:
    runs-on: ubuntu-latest
    needs: setup

    steps:

      - name: DockerHub Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


  # =========================================
  # Job 3 - Build and Push Backend Image
  # =========================================

  backend-build:
    runs-on: ubuntu-latest
    needs: docker-login

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend:latest ./backend

      - name: Push Backend Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend:latest


  # =========================================
  # Job 4 - Build and Push Frontend Image
  # =========================================

  frontend-build:
    runs-on: ubuntu-latest
    needs: docker-login

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend:latest ./frontend

      - name: Push Frontend Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend:latest


  # =========================================
  # Job 5 - Verify DockerHub Images
  # =========================================

  verify-images:
    runs-on: ubuntu-latest
    needs:
      - backend-build
      - frontend-build

    steps:

      - name: Verify Backend Image
        run: |
          echo "Backend image pushed successfully"

      - name: Verify Frontend Image
        run: |
          echo "Frontend image pushed successfully"
